services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_DSN: postgresql+asyncpg://tbot:tbot@db:5432/tbot
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tbot
      POSTGRES_USER: tbot
      POSTGRES_PASSWORD: tbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot -d tbot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data_local:
