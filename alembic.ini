[alembic]
script_location = alembic
prepend_sys_path = .
# Fallback DSN. Overridden by DATABASE_URL or DB_DSN at runtime
# (see alembic/env.py::_resolve_db_url).
sqlalchemy.url = sqlite+aiosqlite:///./bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
